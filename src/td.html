<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=1.0, user-scalable=yes">
	<title>HTML5 Tower Defense</title>
	<link href="css/c.css" rel="stylesheet" media="screen">
</head>

<body id="tower-defense">
<div id="wrapper">
	<div id="td-wrapper">
		<h1>HTML5 塔防游戏</h1>

		<div id="td-controls">
			<button id="td-btn-normal" type="button">Start Normal</button>
			<button id="td-btn-leaderboard" type="button">Start Leaderboard</button>
			<button id="td-btn-leaderboard-open" type="button">Leaderboard</button>
			<span id="td-submit-status"></span>
		</div>

		<div id="td-loading">加载中...</div>
		<div id="td-board">
			<canvas id="td-canvas">抱歉，您的浏览器不支持 HTML 5 Canvas 标签，请使用 IE9 / Chrome / Opera 等浏览器浏览本页以获得最佳效果。</canvas>
		</div>

		<div id="td-leaderboard-panel">
			<div class="lb-header">
				<span>Leaderboard</span>
				<button id="td-leaderboard-refresh" type="button">Refresh</button>
				<button id="td-leaderboard-close" type="button">Close</button>
			</div>
			<div id="td-leaderboard-status" class="lb-status"></div>
			<div class="lb-section">
				<div class="lb-title">Top 100</div>
				<ol id="td-leaderboard-list" class="lb-list"></ol>
			</div>
			<div class="lb-section">
				<div class="lb-title">My Rank</div>
				<div id="td-leaderboard-me" class="lb-me">-</div>
			</div>
		</div>
	</div>
	<div id="about">
		<a href="http://oldj.net/article/html5-tower-defense/" target="_blank">关于</a> |
		<a href="https://github.com/oldj/html5-tower-defense" target="_blank">源码</a> |
		<a href="http://oldj.net/">oldj.net</a> &copy; 2010-2011
	</div>
</div>

<script type="text/javascript" src="js/td.js"></script>
<script type="text/javascript" src="js/td-random.js"></script>
<script type="text/javascript" src="js/td-tick-clock.js"></script>
<script type="text/javascript" src="js/td-rules-manager.js"></script>
<script type="text/javascript" src="js/td-entity-manager.js"></script>
<script type="text/javascript" src="js/td-recorder.js"></script>
<script type="text/javascript" src="js/td-action-dispatcher.js"></script>
<script type="text/javascript" src="js/td-scoring-system.js"></script>
<script type="text/javascript" src="js/td-speed-controller.js"></script>
<script type="text/javascript" src="js/td-audio.js"></script>
<script type="text/javascript" src="js/td-api-client.js"></script>
<script type="text/javascript" src="js/td-auth.js"></script>
<script type="text/javascript" src="js/td-leaderboard.js"></script>
<script type="text/javascript" src="js/td-lang.js"></script>
<script type="text/javascript" src="js/td-event.js"></script>
<script type="text/javascript" src="js/td-stage.js"></script>
<script type="text/javascript" src="js/td-element.js"></script>
<script type="text/javascript" src="js/td-obj-map.js"></script>
<script type="text/javascript" src="js/td-obj-grid.js"></script>
<script type="text/javascript" src="js/td-obj-building.js"></script>
<script type="text/javascript" src="js/td-obj-monster.js"></script>
<script type="text/javascript" src="js/td-obj-panel.js"></script>
<script type="text/javascript" src="js/td-data-stage-1.js"></script>
<script type="text/javascript" src="js/td-cfg-buildings.js"></script>
<script type="text/javascript" src="js/td-cfg-monsters.js"></script>
<script type="text/javascript" src="js/td-render-buildings.js"></script>
<script type="text/javascript" src="js/td-msg-zh.js"></script>
<script type="text/javascript" src="js/td-walk.js"></script>

<!--<script type="text/javascript" src="td-pkg-min.js?fmts=1"></script>-->
<script type="text/javascript">
	window.onload = function () {
		_TD.init("td-board", true);
		document.getElementById("td-loading").style.display = "none";
		document.getElementById("td-board").style.display = "block";
	};
</script>
</body>
</html>
